name: smoke

on:
  push:
  pull_request:

jobs:
  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile src/config_loader.py src/check_mcp.py src/mihomo_api.py src/watcher.py
      - name: Parse default configuration
        shell: pwsh
        run: Get-Content config/default.json -Raw | ConvertFrom-Json | Out-Null
      - name: Parse PowerShell control script
        shell: pwsh
        run: |
          $errors = @()
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\control.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
