name: smoke

on:
  push:
  pull_request:

jobs:
  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile control.py src/config_loader.py src/check_mcp.py src/mihomo_api.py src/watcher.py
      - name: Parse default configuration
        run: python -c "import json, pathlib; json.loads(pathlib.Path('config/default.json').read_text(encoding='utf-8'))"
